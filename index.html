<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timões do Xerem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;800&display=swap');

  :root{
    --barca-blue:#004d98;
    --barca-garnet:#a50044;
    --barca-gold:#edbb00;
    --fla-black:#050505;
    --fla-red:#c8102e;
    --gold:#f0c419;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;
    font-family:'Manrope',system-ui,sans-serif;
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      linear-gradient(90deg,
        var(--barca-blue) 0%, var(--barca-blue) 16.66%,
        var(--barca-garnet) 16.66%, var(--barca-garnet) 33.33%,
        var(--barca-gold) 33.33%, var(--barca-gold) 50%,
        var(--fla-black) 50%, var(--fla-black) 75%,
        var(--fla-red) 75%, var(--fla-red) 100%);
    position:relative;
  }

  header{
    text-align:center;
    padding:48px 16px 12px;
    position:relative;
    z-index:2;
  }
  header h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:clamp(34px,7vw,64px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:#fff;
    margin:0;
    text-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  header p{
    color:rgba(255,255,255,0.75);
    margin-top:10px;
    font-size:14px;
    letter-spacing:0.5px;
  }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:min(6vw,80px);
    padding:40px 16px 80px;
    position:relative;
    z-index:2;
    flex-wrap:wrap;
  }

  .team-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color:#fff;
    transition:transform 0.35s ease;
  }
  .team-card:hover{ transform:translateY(-10px); }

  .crest-wrap{
    width:clamp(150px,22vw,230px);
    height:clamp(150px,22vw,230px);
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid rgba(255,255,255,0.25);
    transition:box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
  }
  .team-card img{
    width:64%;
    height:64%;
    object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5));
  }

  .barca-card .crest-wrap:hover{
    border-color:var(--gold);
    box-shadow:0 0 0 6px rgba(240,196,25,0.12), 0 20px 40px rgba(0,0,0,0.4);
    background:rgba(255,255,255,0.14);
  }
  .fla-card .crest-wrap:hover{
    border-color:var(--fla-red);
    box-shadow:0 0 0 6px rgba(200,16,46,0.18), 0 20px 40px rgba(0,0,0,0.4);
    background:rgba(255,255,255,0.14);
  }

  .team-card .name{
    margin-top:20px;
    font-family:'Anton',sans-serif;
    font-size:clamp(20px,3vw,28px);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .team-card .tag{
    margin-top:4px;
    font-size:12px;
    color:rgba(255,255,255,0.6);
    letter-spacing:1px;
  }

  footer{
    text-align:center;
    color:rgba(255,255,255,0.45);
    font-size:12px;
    padding:20px 16px 30px;
    position:relative;
    z-index:2;
  }

  @media (max-width:600px){
    body{
      background:linear-gradient(90deg,
        var(--barca-blue) 0%, var(--barca-blue) 16.66%,
        var(--barca-garnet) 16.66%, var(--barca-garnet) 33.33%,
        var(--barca-gold) 33.33%, var(--barca-gold) 50%,
        var(--fla-black) 50%, var(--fla-black) 75%,
        var(--fla-red) 75%, var(--fla-red) 100%);
    }
    main{ gap:36px; }
  }
</style>
</head>
<body>

<header>
  <h1>Timões do Xerem</h1>
  <p>acompanhando Barça & Mengão em um só lugar</p>
</header>

<main>
  <a href="barcelona.html" class="team-card barca-card">
    <div class="crest-wrap">
      <img id="badge-barca" alt="Escudo do Barcelona">
    </div>
    <div class="name">Barcelona</div>
    <div class="tag">La Liga</div>
  </a>

  <a href="flamengo.html" class="team-card fla-card">
    <div class="crest-wrap">
      <img id="badge-fla" alt="Escudo do Flamengo">
    </div>
    <div class="name">Flamengo</div>
    <div class="tag">Brasileirão</div>
  </a>
</main>

<footer>dados via TheSportsDB</footer>

<script>
async function loadBadge(teamName, imgId){
  try{
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(teamName)}`);
    const data = await res.json();
    const team = data.teams && data.teams[0];
    if(team && team.strTeamBadge){
      document.getElementById(imgId).src = team.strTeamBadge;
    }
  }catch(e){
    console.error('não foi possível carregar o escudo de', teamName, e);
  }
}
loadBadge('Barcelona', 'badge-barca');
loadBadge('Flamengo', 'badge-fla');
</script>

</body>
</html>
